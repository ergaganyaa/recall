<text x="645" y="491.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c1f24">tables with row level security (every row has user_id)</text>
<text x="645" y="508.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c1f24">assistant_context(), record_reading_checkpoint(), insert_volume()</text>
<text x="645" y="525.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c1f24">full-text index (tsvector, GIN)</text>
