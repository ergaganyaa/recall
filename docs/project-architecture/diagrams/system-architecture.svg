<text x="105" y="517" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c1f24">sessions</text>
<rect x="195" y="440" width="150" height="110" rx="6" fill="#ffffff" stroke="#4a6f95" stroke-width="1.4"/>
<text x="270" y="483" text-anchor="middle" font-size="14" font-weight="600" fill="#1c1f24">Storage</text>
<text x="270" y="500" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c1f24">private bucket</text>
<text x="270" y="517" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c1f24">book-images</text>
<rect x="385" y="440" width="520" height="110" rx="6" fill="#eaf2fb" stroke="#4a6f95" stroke-width="1.4"/>
