<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b4a6b"/></marker></defs>
<rect x="15" y="15" width="1070" height="120" rx="10" fill="#f4f7fb" stroke="#9fb3c8" stroke-width="1.2"/>
